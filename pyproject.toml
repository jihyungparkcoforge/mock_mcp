[project]
name = "equipment-mcp"
version = "0.1.0"
description = "Mock IT equipment request system exposed as an MCP server, plus a ReAct agent"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "anthropic>=2.12",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/equipment_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
